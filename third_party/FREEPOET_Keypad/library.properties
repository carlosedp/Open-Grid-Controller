sentence=FREEPOET_keypad Arduino library for 8x8-Pad protocol 0x02 I2C devices.
paragraph=Control 128 grayscale LEDs and read 128 keys over I2C. Preferred APIs use level, packed block, and buffered show commands defined by protocol 0x02. No external library dependency is required beyond the Arduino core Wire library. Compatible with AVR, SAMD, Renesas RA4M1, ESP32, ESP8266, RP2040, and RP2350.
