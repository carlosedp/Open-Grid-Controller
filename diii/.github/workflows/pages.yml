# Publishes diii to GitHub Pages (https://diii.vfmod.com) on every push to main.
#
# diii is plain static files; the only build step gives the service worker a
# cache name per commit, so installed copies (PWA) switch to each release.
# Repository settings: Pages -> Source: GitHub Actions; custom domain
# diii.vfmod.com, Enforce HTTPS (Web Serial needs HTTPS).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          rsync -a --exclude '.*' --exclude docs --exclude README.md ./ _site/
          sed -i "s/const CACHE = '[^']*';/const CACHE = 'diii-${GITHUB_SHA::7}';/" _site/sw.js
          grep -q "const CACHE = 'diii-${GITHUB_SHA::7}';" _site/sw.js
          ls -R _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
