<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101010">
    <title>diii</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="vendor/prism-code-editor.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <div class="title-pill">
                    <h1>//// diii</h1>
                </div>
                <div id="replStatusPill" class="repl-status-pill">
                    <span id="replStatusIndicator" class="repl-status-indicator"></span>
                    <span id="replStatusText" class="repl-status-text">not connected</span>
                </div>
                <button type="button" id="replConnectionBtn" class="repl-connection-btn" title="connect/disconnect (Cmd/Ctrl+Shift+C)">connect</button>
                <div class="device-menu-wrap">
                    <button type="button" id="deviceMenuBtn" class="repl-connection-btn" aria-haspopup="menu" aria-expanded="false">device ▾</button>
                    <div id="deviceMenu" class="file-menu device-menu" role="menu">
                        <button type="button" id="reinitBtn" class="file-menu-item" role="menuitem" title="restart Lua and run the first script again, without rebooting (^^i)">re-init</button>
                        <button type="button" id="restartBtn" class="file-menu-item" role="menuitem">reboot</button>
                        <button type="button" id="bootloaderBtn" class="file-menu-item" role="menuitem">bootloader</button>
                        <button type="button" id="backupBtn" class="file-menu-item" role="menuitem" title="download every file on the device as one zip">backup</button>
                        <button type="button" id="restoreBtn" class="file-menu-item" role="menuitem" title="upload the files of a backup zip">restore</button>
                        <button type="button" id="reformatBtn" class="file-menu-item" role="menuitem" title="erase every file on the device">reformat</button>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <button id="scriptReferenceBtn" class="repl-connection-btn" title="iii reference (works offline)">reference</button>
            </div>
        </header>

        <div class="workspace">
            <div class="split-container" id="splitContainer">
                <aside class="file-explorer-pane" id="fileExplorerPane">
                    <div class="file-explorer-header">
                        <button type="button" id="toggleExplorerBtn" class="file-explorer-toggle" aria-label="toggle file explorer" aria-expanded="false">
                            <span class="file-explorer-icon" aria-hidden="true">
                                <svg viewBox="0 0 16 16" role="img" aria-hidden="true" focusable="false">
                                    <path d="M4 1.75h5.2l3.05 3.05V14.25H4z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
                                    <path d="M9.2 1.75v3.05h3.05" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
                                </svg>
                            </span>
                            <span id="explorerChevron" class="file-explorer-chevron" aria-hidden="true">›</span>
                        </button>
                        <div class="repl-actions-spacer"></div>
                        <button type="button" id="newFileBtn" class="file-explorer-refresh file-explorer-new" aria-label="new file" title="new file">+</button>
                        <button type="button" id="refreshExplorerBtn" class="file-explorer-refresh" type="button" aria-label="refresh file view" title="refresh file view">
                            <!-- License: MIT. Made by elusiveicons: https://elusiveicons.com -->
                            <svg viewBox="0 0 1200 1200" role="img" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
                                <path d="M600,0C308.74,0,66.009,207.555,11.499,482.812h166.553C229.37,297.756,398.603,161.719,600,161.719c121.069,0,230.474,49.195,309.668,128.613l-192.48,192.48h304.762H1200V0l-175.781,175.781C915.653,67.181,765.698,0,600,0z M0,717.188V1200l175.781-175.781C284.346,1132.819,434.302,1200,600,1200c291.26,0,533.991-207.555,588.501-482.812h-166.553C970.631,902.243,801.396,1038.281,600,1038.281c-121.069,0-230.474-49.195-309.668-128.613l192.48-192.48H0z" fill="currentColor"/>
                            </svg>
                        </button>
                    </div>
                    <div id="fileList" class="file-list" aria-label="file list"></div>
                    <div id="fileSpaceFooter" class="file-space-footer">free space: -- kb</div>
                </aside>
                <div id="explorerResizer" class="explorer-resizer" role="separator" tabindex="0" aria-orientation="vertical" aria-label="resize explorer" aria-controls="fileExplorerPane"></div>
                <div id="workArea" class="work-area">
                <div class="repl-pane full-width" id="replPane">
                    <div class="repl-content">
                        <div id="gridPanel" class="grid-panel" hidden>
                            <div id="gridCells" class="grid-cells" role="grid" aria-label="virtual grid"></div>
                        </div>
                        <div class="repl-output-area">
                            <div id="output" class="repl-output"></div>
                            <button type="button" id="clearBtn" class="repl-action-btn output-cleanup-btn">clean</button>
                        </div>
                        <div class="repl-actions">
                            <button type="button" id="uploadBtn" class="repl-action-btn">upload</button>
                            <button type="button" id="gridBtn" class="repl-action-btn" title="show the grid's LEDs and press keys from here" hidden>grid</button>
                            <div class="repl-actions-spacer"></div>
                            <button type="button" id="helpBtn" class="repl-action-btn">help</button>
                        </div>
                        <div class="repl-input-container">
                            <div class="repl-input-row">
                                <span class="repl-input-prompt" aria-hidden="true">&gt;&gt;</span>
                                <label for="replInput" style="display: none;">type iii commands here</label>
                                <textarea id="replInput" class="repl-input" placeholder="send iii commands live here" aria-describedby="replInput"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="editorResizer" class="explorer-resizer editor-resizer" role="separator" aria-orientation="vertical" aria-label="resize editor" hidden></div>
                <section id="editorPane" class="editor-pane" aria-label="script editor" hidden>
                    <button type="button" id="editorExpandBtn" class="editor-expand" title="show the editor">
                        <span id="editorExpandTitle"></span>
                    </button>
                    <div class="editor-header">
                        <span id="editorTitle" class="editor-title"></span>
                        <span id="editorDirty" class="editor-dirty" title="unsaved changes" hidden>●</span>
                        <div class="repl-actions-spacer"></div>
                        <button type="button" id="editorSaveBtn" class="repl-action-btn" title="save to the device (Ctrl+S)">save</button>
                        <button type="button" id="editorSaveAsBtn" class="repl-action-btn" title="save under another name">save as</button>
                        <button type="button" id="editorRunBtn" class="repl-action-btn" title="save and run">run</button>
                        <button type="button" id="editorLayoutBtn" class="editor-close-btn" aria-label="switch layout" title="editor below the console / beside it">⇅</button>
                        <button type="button" id="editorMinimizeBtn" class="editor-close-btn" aria-label="hide editor" title="hide the editor (keeps the file open)">–</button>
                        <button type="button" id="editorCloseBtn" class="editor-close-btn" aria-label="close editor" title="close">✕</button>
                    </div>
                    <div id="editorHost" class="editor-host"></div>
                </section>
                </div>
            </div>
        </div>

        <label for="fileInput" style="display: none;">load a lua file</label>
        <input type="file" id="fileInput" accept=".lua" multiple aria-describedby="fileInput" style="display: none;">
    </div>

    <div role="dialog" aria-modal="true" aria-label="iii reference" id="referenceModal" class="modal" style="display: none;">
        <div class="modal-content reference-content">
            <div class="reference-header">
                <input type="search" id="referenceSearch" class="reference-search" placeholder="search, e.g. grid_led or metro" aria-label="search the reference">
                <a href="https://monome.org/docs/iii/code" target="_blank" rel="noopener noreferrer" class="repl-connection-btn" title="monome's iii documentation">online docs ↗</a>
                <button type="button" id="referenceCloseBtn" class="editor-close-btn" aria-label="close reference" title="close (Esc)">✕</button>
            </div>
            <div id="referenceList" class="reference-list"></div>
        </div>
    </div>

    <div role="alertdialog" aria-modal="true" id="browserWarning" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Browser Not Supported</h2>
            <p>This application requires the Web Serial API, which is only available in Chromium-based browsers.</p>
            <p>Please use Chrome, Edge, or Opera.</p>
            <button type="button" id="closeWarning" class="modal-btn">Close</button>
        </div>
    </div>

    <script type="module" src="diii.js"></script>
</body>
</html>
