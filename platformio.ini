; PlatformIO project for the iii firmware in iii-open-grid/.
;
; PlatformIO installs pico-sdk 2.2.0, Arm GCC 14.2, CMake and Ninja, then
; builds iii-open-grid/CMakeLists.txt (see iii-open-grid/tools/pio_cmake.py).
; Build/Upload/Monitor from the VS Code PlatformIO sidebar work as usual.
;
;   pio run -e xiao_rp2040 -t upload
;
; The original Arduino firmware is a separate PlatformIO project in sw/.

[platformio]
; offline until the full toolchain is downloaded; switch back to xiao_rp2040 after
default_envs = xiao_rp2040_offline
src_dir = iii-open-grid/src
include_dir = iii-open-grid/src

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
platform_packages =
    framework-picosdk
    platformio/toolchain-gccarmnoneeabi@~1.140201.0
    tool-cmake
    tool-ninja
extra_scripts = pre:iii-open-grid/tools/pio_cmake.py
monitor_speed = 115200
; keypad I2C clock in Hz (100000 is what the Arduino firmware uses)
custom_og_i2c_hz = 100000

; Seeed XIAO RP2040 (dev/test board; keypads on D4 = SDA, D5 = SCL)
[env:xiao_rp2040]
board = seeed_xiao_rp2040
custom_og_board = xiao_rp2040

; Waveshare RP2040-Zero, as in the Open Grid kit (keypads on GPIO4/5)
[env:rp2040_zero]
board = waveshare_rp2040_zero
custom_og_board = rp2040_zero

; --- Offline builds --------------------------------------------------------
; For slow or no internet: reuse what is already installed instead of
; downloading ~300 MB of toolchain and pico-sdk.
;   - toolchain: the Arduino-Pico one (installed by the sw/ project)
;   - pico-sdk:  a 2.2.0 checkout with lib/tinyusb in .deps/ (git-ignored)
;   - CMake/make (or ninja) from PATH
;   - platform:  the same pinned version sw/ uses (already installed)
[offline]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#03bb48f3d54b02f8fbe53b9e0543920a0177e466
platform_packages =
    toolchain-gccarmnoneeabi@symlink://${platformio.packages_dir}/toolchain-rp2040-earlephilhower
custom_pico_sdk_path = .deps/pico-sdk-2.2.0

[env:xiao_rp2040_offline]
extends = env:xiao_rp2040, offline

[env:rp2040_zero_offline]
extends = env:rp2040_zero, offline
